version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    day: monday
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    github-actions-minor-patch:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: "*"
    update-types:
    - "version-update:semver-major"
  commit-message:
    prefix: chore(deps)
